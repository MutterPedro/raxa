<!doctype html>
<html lang="pt-BR">
  <head>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('raxa:theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var mode = pref === 'dark' ? 'dark' : pref === 'light' ? 'light' : dark ? 'dark' : 'light';
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          // An explicit preference outranks the OS scheme, so the media-based theme-color
          // metas would paint the wrong system bar; drop them and let src/infra/theme.ts
          // own a single media-less meta from then on.
          if (pref === 'light' || pref === 'dark') {
            document.querySelectorAll('head meta[name="theme-color"][media]').forEach(function (m) {
              m.remove();
            });
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <title>raxa</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#C2410C" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#EA580C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="raxa" />
    <link
      rel="apple-touch-startup-image"
      href="/splash-light.png"
      media="(prefers-color-scheme: light)"
      width="1024"
      height="1024"
    />
    <link
      rel="apple-touch-startup-image"
      href="/splash-dark.png"
      media="(prefers-color-scheme: dark)"
      width="1024"
      height="1024"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
